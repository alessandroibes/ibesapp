name: Fundação
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet format --no-restore --verify-no-changes
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory TestResults
      - run: dotnet list package --vulnerable --include-transitive --format json > TestResults/dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: TestResults
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run build && npm test
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: apps/web/dist
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run format:check && npm run lint && npm run typecheck && npm test
      - run: npx expo-doctor
      - run: npx expo export --platform android --platform ios
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-bundles
          path: apps/mobile/dist
  container-e2e:
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configurar desenvolvimento
        shell: pwsh
        run: ./scripts/dev-setup.ps1
      - run: docker compose up --build -d
      - name: Aguardar readiness
        run: |
          for i in {1..30}; do
            if curl --fail --silent --insecure https://localhost:7443/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Navegador e contrato
        shell: pwsh
        run: |
          $env:BOOTSTRAP_PASSWORD = ((Get-Content .env | Where-Object { $_ -like 'BOOTSTRAP_PASSWORD=*' }) -split '=',2)[1]
          Set-Location apps/web
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl -kfsS https://localhost:7443/openapi/v1.json -o ../../artifacts/openapi.json
          npx openapi-typescript ../../artifacts/openapi.json -o ../../packages/contracts/api.d.ts
          git diff --exit-code -- ../../packages/contracts/api.d.ts
      - run: docker save ibes-api -o artifacts/ibes-api.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-e2e
          path: artifacts
      - run: docker compose down
        if: always()
